name: Claude PR Review (manual)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head
      - uses: anthropics/claude-code-action@939ae9c056ecf8a1a01409ddd1c4eadec5f8c77b  # v1.0.116
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude review'
          prompt: |-
            Review this PR for the codebase-mapper project. Read AGENTS.md
            for the operative discipline. Focus on:

            * Cross-file vocabulary: do config readers (cbm/cli.py) and
              writers (templates, fixtures, config files) use the same
              field names? Read the relevant files and check.
            * Gate-logic semantics: any new skip/tolerate/fallback path
              in gate code (loop-status, checkpoint, disposition,
              pass-claim) — does the PR Why section justify it?
            * W/V/B substance: the PR description names verifications.
              Read the diff and judge whether the named verifications
              are plausible and specific (a real command, a real test
              file, a real artifact). You do not have shell access; do
              not attempt to run commands.
            * ADR coherence: if .planning/decisions/ADR-*.md changed or
              if any change contradicts an existing ADR, flag it with
              the ADR number.

            Post a single structured comment. Do not modify code.
            Do not duplicate findings already raised by CodeRabbit if
            you can see them in the PR thread.
