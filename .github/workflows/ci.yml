name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress PR runs when a newer commit lands; preserve main-push runs
# so the green check on a real merge SHA survives (matters once required status
# checks are wired into branch protection).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.5"

      - name: Ruff check
        run: ruff check .
        # `ruff format --check` is intentionally NOT enforced in this workflow:
        # adopting it would require a one-time whole-codebase reformat that does
        # not belong in the same PR that introduces CI. Track via follow-up.

  build:
    name: build + import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build + twine
        run: pip install "build>=1.0" "twine>=4"

      - name: Build sdist + wheel
        run: python -m build

      - name: List artifacts
        run: ls -la dist/

      - name: Twine metadata check
        run: twine check dist/*

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl

      - name: Smoke-test installed CLI + package-data globs
        # Verifies the wheel ships every declared package-data root (not just
        # loop_status_config.json). A typo in pyproject.toml's [tool.setuptools.package-data]
        # would otherwise produce a wheel that goes green here but fails in
        # production at the first `cbm validate` / `cbm consult` / skill-load call.
        # Deliberately does NOT run `cbm loop-status --scope broad-goal` — that
        # is a planning-state discipline gate, not an installability proof, and
        # would couple build-job pass/fail to in-flight review session state.
        run: |
          /tmp/smoke-venv/bin/python -m cbm --help
          /tmp/smoke-venv/bin/cbm --help
          /tmp/smoke-venv/bin/python -c "
          from importlib.resources import files
          root = files('cbm')
          assert (root / 'loop_status_config.json').is_file(), 'loop_status_config.json missing from wheel'
          assert any(p.suffix == '.md' for p in (root / 'runtime_skills').iterdir()), 'runtime_skills/*.md missing from wheel'
          assert any(p.name.endswith('.schema.json') for p in (root / 'schemas').iterdir()), 'schemas/*.schema.json missing from wheel'
          assert any(p.suffix == '.json' for p in (root / 'goal_packs').iterdir()), 'goal_packs/*.json missing from wheel'
          assert any(p.suffix == '.json' for p in (root / 'project_packs').iterdir()), 'project_packs/*.json missing from wheel'
          print('package-data globs all resolve in installed wheel')
          "

      - name: Install sdist into a separate clean venv
        # Sdist install path is independent of the wheel path and can break on
        # MANIFEST.in / package-data issues that the wheel path masks.
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --upgrade pip
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/cbm --help

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
