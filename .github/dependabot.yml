version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "jsonschema"
          - "pyyaml"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "build"
